<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Stag Lore – Study</title>
  <script>
    (() => {
      const cacheKey = new URLSearchParams(window.location.search).get("_cb") || "";
      window.__STAG_LORE_CACHE_BUST__ = cacheKey;

      const stylesheet = document.createElement("link");
      stylesheet.id = "site-styles";
      stylesheet.rel = "stylesheet";
      stylesheet.href = "styles.css" + (cacheKey ? "?v=" + encodeURIComponent(cacheKey) : "");
      document.head.appendChild(stylesheet);
    })();
  </script>
  <noscript><link rel="stylesheet" href="styles.css" /></noscript>
</head>
<body>

  <main class="scene-shell">
    <div id="scene" class="scene">
      <!-- The browser selects the correct artwork before layout. -->
      <picture class="scene-picture">
        <source
          media="(orientation: portrait)"
          srcset="./lore-assets/stag-study-mobile.png"
        />
        <img
          id="scene-bg"
          class="scene-bg"
          src="./lore-assets/stag-study.png"
          alt="The Black Stag study"
          fetchpriority="high"
          decoding="async"
          draggable="false"
        />
      </picture>

      <!-- Hotspot buttons (each has its own ID) -->
      <button class="hotspot hotspot-book" id="btn-book" type="button" aria-label="Book">
        <picture class="hotspot-picture">
          <source
            media="(orientation: portrait)"
            srcset="./lore-assets/book-button-portrait.png"
          />
          <img src="./lore-assets/book-button.png" alt="" draggable="false" />
        </picture>
      </button>

      <button class="hotspot hotspot-skull" id="btn-skull" type="button" aria-label="Skull">
        <picture class="hotspot-picture">
          <source
            media="(orientation: portrait)"
            srcset="./lore-assets/skull-button-portrait.png"
          />
          <img src="./lore-assets/skull-button.png" alt="" draggable="false" />
        </picture>
      </button>

      <button class="hotspot hotspot-scroll" id="btn-scroll" type="button" aria-label="Scroll">
        <picture class="hotspot-picture">
          <source
            media="(orientation: portrait)"
            srcset="./lore-assets/scroll-button-portrait.png"
          />
          <img src="./lore-assets/scroll-button.png" alt="" draggable="false" />
        </picture>
      </button>

      <button class="hotspot hotspot-beaker" id="btn-beaker" type="button" aria-label="Beaker">
        <picture class="hotspot-picture">
          <source
            media="(orientation: portrait)"
            srcset="./lore-assets/beaker-button-portrait.png"
          />
          <img src="./lore-assets/beaker-button.png" alt="" draggable="false" />
        </picture>
      </button>
    </div>
  </main>

  <script>
    (() => {
      const cacheKey = window.__STAG_LORE_CACHE_BUST__ || "";
      const script = document.createElement("script");
      script.async = false;
      script.src = "script.js" + (cacheKey ? "?v=" + encodeURIComponent(cacheKey) : "");
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
